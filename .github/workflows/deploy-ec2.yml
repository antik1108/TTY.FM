name: Deploy to EC2

on:
  push:
    branches:
      - antik-laptop
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy and restart on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
      EC2_PORT: ${{ secrets.EC2_PORT }}

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=0

          for name in EC2_HOST EC2_USER EC2_SSH_KEY_B64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy and restart service on EC2
        run: |
          set -euo pipefail
          echo "$EC2_SSH_KEY_B64" | base64 --decode > /tmp/ec2_ssh_key
          chmod 600 /tmp/ec2_ssh_key

      - name: Deploy and restart service on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key_path: /tmp/ec2_ssh_key
          port: ${{ env.EC2_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/apps/tty.fm

            git fetch --all --prune
            git checkout antik-laptop
            git reset --hard origin/antik-laptop

            npm --prefix backend ci
            npm --prefix frontend ci
            npm --prefix frontend run build

            sudo systemctl restart ttyfm-backend
            sudo systemctl is-active --quiet ttyfm-backend
            sudo systemctl status ttyfm-backend --no-pager
