name: CI/CD Pipeline

on:
  push:
    branches: [ antik-laptop ]
  pull_request:
    branches: [ '**' ]

jobs:
  # Backend Testing & Linting
  backend:
    name: Backend - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend linter
        working-directory: backend
        run: npm run lint

      - name: Run backend format check (Prettier)
        working-directory: backend
        run: npm run format:check

      - name: Check for syntax errors
        working-directory: backend
        run: node --check src/server.js

      - name: Verify backend structure
        working-directory: backend
        run: |
          echo "✓ Checking backend structure..."
          [ -f "src/server.js" ] && echo "✓ Server entry point found" || (echo "✗ Missing src/server.js"; exit 1)
          [ -d "src/config" ] && echo "✓ Config directory found" || (echo "✗ Missing src/config"; exit 1)
          [ -d "src/modules" ] && echo "✓ Modules directory found" || (echo "✗ Missing src/modules"; exit 1)
          [ -d "src/routes" ] && echo "✓ Routes directory found" || (echo "✗ Missing src/routes"; exit 1)

  # Frontend Testing & Linting
  frontend:
    name: Frontend - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript compiler check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Linter (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run format check (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Run Unit & Integration Tests
        working-directory: frontend
        run: npm run test -- --passWithNoTests --ci

      - name: Generate Coverage Report
        working-directory: frontend
        run: npm run test:coverage -- --passWithNoTests

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # E2E Tests
  e2e:
    name: E2E Tests - Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        working-directory: frontend
        run: npm run test:e2e -- --reporter=html

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

  # Status Check
  status:
    name: Status Check
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "failure" ] || [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ CI Pipeline Passed"
